name: Deploy to Hostinger

# Publica a landing na Hostinger (subdomínio caa.convivereaprender.com.br)
# a cada push na branch main, via FTP.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-caa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/caa/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.md
            **/.DS_Store
